name: Test the package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: GregorLueg/personal-actions/.github/workflows/rust-test.yml@v1
    with:
      # Two runs: the minimal build and the feature build. The minimal one keeps
      # `r` on, so the R wrappers are still compiled and tested; the build
      # without `r` is covered by the Python workflow.
      cpu-args: '--no-default-features --features r'
      cpu-args-extra: '--features single-cell,multi-modal,hdf5-static'
      gpu-args: '--features gpu,single-cell,hdf5-static'
      # extendr links against R, so the toolchain needs the gnu ABI on Windows
      # and a shared libR on Linux.
      needs-r: true
      # The expensive GPU tests sit behind large_scale_diagnostics, which this
      # lane deliberately does not enable.
      gpu-malloc-check: true
    secrets: inherit
