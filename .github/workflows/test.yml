name: Test the package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: GregorLueg/personal-actions/.github/workflows/rust-workspace-test.yml@v1
    with:
      # No R on this lane: only bixverse-r links libR.
      cpu-runs: |
        -p bixverse-core
        -p bixverse-methods --features dge
        -p bixverse-sc-data --features hdf5-static
        -p bixverse-sc --features multi-modal
        -p bixverse-rs --features single-cell,multi-modal
        -p bixverse-rs --features single-cell,multi-modal,hdf5-static
      # extendr links against R, so this lane needs the gnu ABI on Windows and
      # a shared libR on Linux.
      r-runs: |
        -p bixverse-r
        -p bixverse-r --features single-cell,multi-modal
        -p bixverse-r --features single-cell,multi-modal,hdf5-static
      # The expensive GPU tests sit behind large-test and
      # large_scale_diagnostics, which this lane deliberately does not enable.
      gpu-runs: |
        -p bixverse-gpu
        -p bixverse-sc-gpu
        -p bixverse-rs --features sc-gpu,hdf5-static
      check-exclude: bixverse-r
      gpu-malloc-check: true
    secrets: inherit
