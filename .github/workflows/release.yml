name: Release

on:
  workflow_run:
    workflows: ["Test the package"]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: GregorLueg/personal-actions/.github/workflows/rust-release.yml@fix-release-recovery
    with:
      publish-args: '--features single-cell,multi-modal,gpu'
      # cargo publish builds the crate to verify it, and that build links
      # against R.
      needs-r: true
    secrets: inherit
