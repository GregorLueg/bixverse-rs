name: Release

on:
  workflow_run:
    workflows: ["Test the package"]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: GregorLueg/personal-actions/.github/workflows/rust-workspace-release.yml@v1
    with:
      # cargo publish builds each member to verify it, and bixverse-r's build
      # links against R.
      needs-r: true
    secrets: inherit
