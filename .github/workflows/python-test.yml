name: Test the Python bindings

# The name matters. python-release.yml keys its workflow_run trigger off it,
# so renaming this silently stops every release.

on:
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - 'crates/bixverse-core/**'
      - 'crates/bixverse-sc-data/**'
      - 'Cargo.toml'
      - '.github/workflows/python-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'python/**'
      - 'crates/bixverse-core/**'
      - 'crates/bixverse-sc-data/**'
      - 'Cargo.toml'
      - '.github/workflows/python-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: GregorLueg/personal-actions/.github/workflows/python-maturin-test.yml@v1
    with:
      package: bixverse
      # abi3-py311 and requires-python >=3.11: the shared default starts at 3.10.
      python-versions: '["3.11","3.13"]'
      # scipy arrives via the `sparse` extra; the loader tests rebuild each batch
      # into a CSR matrix to check it against the store they were written from.
      extra-deps: 'scipy'
      # CPU torch wheels: the default Linux resolution pulls multi-GB CUDA ones.
      # No `gpu` extra: it builds both wheels in release from source, and hosted
      # runners have no adapter, so test_gpu.py skips anyway.
      install-args: '--extra sparse --extra torch --extra mlx --extra jax --extra embed --extra plots --torch-backend cpu'
