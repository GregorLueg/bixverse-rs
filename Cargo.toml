[workspace]
resolver = "3"
members = ["crates/*"]
# The Python bindings are their own workspace root, so `cargo publish` and a
# root `cargo test` never see pyo3.
exclude = ["python"]

[workspace.package]
version = "0.11.0"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
repository = "https://github.com/GregorLueg/bixverse-rs"
readme = "README.md"
categories = [
  "science::computational-biology",
  "science::bioinformatics",
  "mathematics",
  "algorithms",
]

#####################
# Compilation flags #
#####################

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

################
# Dependencies #
################

[workspace.dependencies]
# Workspace crates. Every internal dependency drops default features, so a
# feature switched off at the top cannot be switched back on underneath.
bixverse-sparse = { path = "crates/bixverse-sparse", version = "0.11.0", default-features = false }
bixverse-core = { path = "crates/bixverse-core", version = "0.11.0", default-features = false }
bixverse-methods = { path = "crates/bixverse-methods", version = "0.11.0", default-features = false }
bixverse-sc-data = { path = "crates/bixverse-sc-data", version = "0.11.0", default-features = false }
bixverse-sc = { path = "crates/bixverse-sc", version = "0.11.0", default-features = false }
bixverse-gpu = { path = "crates/bixverse-gpu", version = "0.11.0", default-features = false }
bixverse-sc-gpu = { path = "crates/bixverse-sc-gpu", version = "0.11.0", default-features = false }
bixverse-sc-export = { path = "crates/bixverse-sc-export", version = "0.11.0", default-features = false }
bixverse-mlx = { path = "crates/bixverse-mlx", version = "0.11.0", default-features = false }
bixverse-atac = { path = "crates/bixverse-atac", version = "0.11.0", default-features = false }
bixverse-rs = { path = "crates/bixverse-rs", version = "0.11.0", default-features = false }

# External
approx = "0.5.1"
ann-search-rs = { version = "0.13.1", default-features = false }
bincode = { version = "2.0.1", features = ["serde"] }
bonsai-rs = { version = "0.3.3", features = ["sanity"] }
cubecl = { version = "0.11.0", features = ["wgpu"] }
cubecl-utils-rs = "0.2.0"
cubek = { version = "0.3.0", features = ["matmul"] }
document-features = "0.2.12"
edge-rs = "0.4.0"
extendr-api = "0.9.0"
extendr-engine = "0.9.0"
# Pure-Rust zlib backend: no C toolchain on any target.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg", "rand"] }
faer-traits = "0.24.0"
faer-entity = "0.20.1"
half = "2.7.1"
hdf5 = { package = "hdf5-metno", version = "0.15.0", features = ["zlib"] }
hdf5-sys = { package = "hdf5-metno-sys", version = "0.12.4" }
indexmap = "2.13.0"
libc = "0.2.178"
crc32fast = "1.5"
lz4_flex = "0.12.0"
manifolds-rs = "0.10.2"
memchr = "2.7"
memmap2 = "0.9.9"
ndarray = "0.17.2"
num-traits = "0.2.19"
once_cell = "1.21.3"
# Low-level column writer only: no arrow, no codecs beyond zstd.
parquet = { version = "60.0.0", default-features = false, features = ["zstd"] }
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.11.0"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# h5ad / AnnData Zarr writers. Never its `bixverse` feature: that pins an old
# bixverse-sc-data from crates.io
scx-core = { version = "0.6.2", default-features = false }
sprs = "0.11"
statrs = "0.18.0"
# Test and bench scratch files only
tempfile = "3.27.0"
thiserror = "2.0.18"
thousands = "0.2.0"
wide = "1.4.0"
libm = "0.2"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
# anndata Zarr (v2 and v3); same version and codecs as scx-core, so one copy
zarrs = { version = "0.23", default-features = false, features = ["filesystem", "sharding", "crc32c", "zstd", "gzip", "zlib"] }
zstd = "0.14.0"
