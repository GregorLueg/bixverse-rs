[package]
name = "bixverse-rs"
version = "0.5.3"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
repository = "https://github.com/GregorLueg/bixverse-rs"
description = "A Rust library with various utilities for computational biology and single cell."
categories = [
  "science::computational-biology",
  "science::bioinformatics",
  "science::computational-biology::systems-biology",
  "mathematics",
  "algorithms",
]
keywords = ["bioinformatics", "single-cell", "genomics", "statistics", "gpu"]
exclude = ["dev/"]

[lib]
name = "bixverse_rs"
path = "src/lib.rs"

############
# Features #
############

[features]
## Enables the single cell features in bixverse-rs
single-cell = ["half", "bincode", "indexmap", "memmap2", "hdf5", "lz4_flex", "ndarray", "dge"]
## Compile the bundled HDF5 C library from source. Leave it off to link an
## external libhdf5 found via `HDF5_DIR` or pkg-config, which is what the R
## package does on Windows: `hdf5-metno-src` names its output with the host
## toolchain's convention, so an msvc host targeting gnu emits `libhdf5` and
## the link fails.
hdf5-static = ["hdf5?/static"]
## Compile the LZF (32000) and Blosc (32001) filters into the HDF5 build, so
## h5ad files written by `hdf5plugin` with those codecs can be read. Both
## register through `H5Zregister` and never touch the HDF5 plugin path, which
## for a `hdf5-metno-src` build points at a long gone cargo `OUT_DIR`. Off by
## default: Blosc vendors c-blosc plus lz4, zlib and zstd, all built with `cc`.
## Snappy is left out on purpose. It is C++, and the R package links this
## staticlib without the C++ runtime. Filters outside these two (standalone
## zstd, bitshuffle, lz4, blosc2) raise `BixverseErrors::UnsupportedH5Filter`.
## Blosc with snappy passes that check, since the codec sits in the chunk
## header, and fails in `H5Dread` with c-blosc naming the missing compressor.
hdf5-filters = ["hdf5?/lzf", "hdf5?/blosc-lz4", "hdf5?/blosc-zlib", "hdf5?/blosc-zstd"]
## Enables the negative binomial differential expression methods built on
## `edge-rs`: the edgeR quasi-likelihood chain and, with `single-cell`, NEBULA.
## Implied by `single-cell`, but usable on its own for the bulk half.
dge = ["edge-rs"]
## Slow but asserting tests: the GPU parity gates and the large-scale numerical
## checks. These can fail, so they are worth running on a schedule. Run in
## release or the CPU reference solves dominate.
large-test = []
## Unasserted diagnostic sweeps that print tables for a human to read. They
## cannot fail, so running them in CI buys nothing; use them when investigating.
large_scale_diagnostics = []
## Enables multi-modal single cell analysis (requires single-cell)
multi-modal = ["single-cell"]
## Enable GPU-accelerated algorithms and methods
gpu = ["ann-search-rs/gpu", "cubecl", "cubecl-utils-rs", "half", "cubek", "edge-rs?/gpu"]

#####################
# Compilation flags #
#####################

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

################
# Dependencies #
################

[dependencies]
approx = "0.5.1"
ann-search-rs = { version = "0.9.0" }
bincode = { version = "2.0.1", features = ["serde"], optional = true }
cubecl = { version = "0.10.0", features = ["wgpu"], optional = true }
cubecl-utils-rs = { version = "0.1.0", optional = true }
cubek = { version = "0.2.0", features = ["matmul"], optional = true }
document-features = "0.2.12"
edge-rs = { version = "0.1.0", optional = true }
either = "1.15.0"
extendr-api = "0.9.0"
faer = "0.23.2"
faer-traits = "0.23.2"
faer-entity = "0.20.1"
fmt = "0.1.0"
half = { version = "2.7.1", optional = true }
hdf5 = { package = "hdf5-metno", version = "0.14.1", features = [
    "zlib",
], optional = true }
indexmap = { version = "2.13.0", optional = true }
lz4_flex = { version = "0.12.0", optional = true }
memmap2 = { version = "0.9.9", optional = true }
ndarray = { version = "0.16.1", optional = true }
num-traits = "0.2.19"
once_cell = "1.21.3"
petgraph = "0.8.3"
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.11.0"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
statrs = "0.18.0"
thiserror = "2.0.18"
thousands = "0.2.0"
wide = "1.4.0"

#################
# Documentation #
#################

[package.metadata.docs.rs]
features = ["single-cell", "multi-modal", "dge", "hdf5-static", "hdf5-filters"]

###########
# Benches #
###########

[[bench]]
name = "cellsweep_bench"
harness = false
required-features = ["single-cell"]

[[bench]]
name = "hvg_bench"
harness = false
required-features = ["single-cell"]

[[bench]]
name = "pairwise_cor_bench"
harness = false
required-features = ["single-cell"]

[[bench]]
name = "seacells_gpu_bench"
harness = false
required-features = ["gpu", "single-cell"]

[[bench]]
name = "gpu_sparse_svd_bench"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_corr_bench"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_nmf_bench"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_scenic_bench"
harness = false
required-features = ["gpu", "single-cell"]

[[bench]]
name = "gpu_scenic_micro"
harness = false
required-features = ["gpu", "single-cell"]
