[package]
name = "bixverse-atac"
description = "Single cell ATAC-seq for bixverse: fragment ingest, QC, peak and tile counting, TF-IDF, LSI and gene activity."
keywords = ["bioinformatics", "single-cell", "atac-seq", "chromatin"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
exclude = ["tests/"]

[features]
## The 10x h5 reader for the `Peaks` modality of a multiome file. Pulls in
## HDF5 through `bixverse-sc-data`.
h5 = ["bixverse-sc-data/h5"]
## Compile the bundled HDF5 C library from source. See `bixverse-sc-data`.
hdf5-static = ["h5", "bixverse-sc-data/hdf5-static"]
## Slow but asserting tests. Run in release.
large-test = []

[dependencies]
bixverse-core.workspace = true
bixverse-sc.workspace = true
bixverse-sc-data = { workspace = true, features = ["analysis"] }
document-features.workspace = true
faer.workspace = true
flate2.workspace = true
indexmap.workspace = true
memmap2.workspace = true
statrs.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true
tempfile.workspace = true

[package.metadata.docs.rs]
features = ["h5"]
