[package]
name = "bixverse-sc-data"
description = "The bixverse single cell data layer: binary sparse format, streaming readers and h5ad, 10x h5 and MTX ingestion."
keywords = ["bioinformatics", "single-cell", "h5ad", "sparse"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true

[features]
default = ["analysis"]
## Plotting helpers and synthetic data generators. Pulls in `bixverse-core`,
## and with it `faer`, SIMD and nearest neighbour search. Switch it off for a
## reader that only needs the store formats.
analysis = ["dep:bixverse-core", "dep:faer"]
## The h5ad and 10x h5 readers and writers. Pulls in HDF5.
h5 = ["dep:hdf5", "dep:ndarray"]
## Compile the bundled HDF5 C library from source. Leave it off to link an
## external libhdf5 found via `HDF5_DIR` or pkg-config, which is what the R
## package does on Windows: `hdf5-metno-src` names its output with the host
## toolchain's convention, so an msvc host targeting gnu emits `libhdf5` and
## the link fails.
hdf5-static = ["h5", "hdf5/static"]
## Compile the LZF (32000) and Blosc (32001) filters into the HDF5 build, so
## h5ad files written by `hdf5plugin` with those codecs can be read. Both
## register through `H5Zregister` and never touch the HDF5 plugin path, which
## for a `hdf5-metno-src` build points at a long gone cargo `OUT_DIR`.
## Blosc vendors c-blosc plus lz4, zlib and zstd, all built with `cc`.
## Snappy is left out on purpose. It is C++, and the R package links this
## staticlib without the C++ runtime. Filters outside these two (standalone
## zstd, bitshuffle, lz4, blosc2) raise `ScDataErrors::UnsupportedH5Filter`.
## Blosc with snappy passes that check, since the codec sits in the chunk
## header, and fails in `H5Dread` with c-blosc naming the missing compressor.
hdf5-filters = ["h5", "hdf5/lzf", "hdf5/blosc-lz4", "hdf5/blosc-zlib", "hdf5/blosc-zstd"]
## Write the h5ad obs / var dataframes and the 10x barcodes and features to
## Parquet, for DuckDB to ingest with `read_parquet`. Pulls in `parquet`
## without arrow.
parquet = ["h5", "dep:parquet"]

[dependencies]
approx.workspace = true
bincode.workspace = true
bixverse-core = { workspace = true, optional = true }
bixverse-sparse.workspace = true
document-features.workspace = true
faer = { workspace = true, optional = true }
half.workspace = true
hdf5 = { workspace = true, optional = true }
indexmap.workspace = true
lz4_flex.workspace = true
memmap2.workspace = true
ndarray = { workspace = true, optional = true }
num-traits.workspace = true
parquet = { workspace = true, optional = true }
rand.workspace = true
rand_distr.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
serde.workspace = true
thiserror.workspace = true
thousands.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[package.metadata.docs.rs]
features = ["h5", "hdf5-static", "hdf5-filters", "parquet"]
