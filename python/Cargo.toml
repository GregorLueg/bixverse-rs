# Own workspace root, deliberately. The parent workspace is published to
# crates.io and its release job runs `cargo publish`, which must not see a
# path-dependent sibling. This also keeps a root `cargo test` from building pyo3.
#
# Two extensions, built one at a time by maturin: `bixverse-py` (the `bixverse`
# wheel) and `bixverse-gpu-py` (the `bixverse-gpu` wheel). They share
# `py-common` at compile time and nothing at run time; the wheels meet through
# store paths and NumPy arrays.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
publish = false

[workspace.dependencies]
py-common = { path = "crates/py-common" }
bixverse-core = { path = "../crates/bixverse-core" }
bixverse-gpu = { path = "../crates/bixverse-gpu" }
bixverse-methods = { path = "../crates/bixverse-methods" }
bixverse-sc = { path = "../crates/bixverse-sc" }
bixverse-sc-data = { path = "../crates/bixverse-sc-data" }
bixverse-sc-gpu = { path = "../crates/bixverse-sc-gpu" }
crossbeam-channel = "0.5"
cubecl = { version = "0.11.0", features = ["wgpu"] }
cubecl-utils-rs = "0.2.0"
# the `Tested` the edgeR test takes; one copy with bixverse-methods
edge-rs = "0.3.2"
# Same features as the workspace: the default `npy` feature drags `stacker`
# into the tree.
indexmap = "2.13.0"
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg", "rand"] }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
pythonize = "0.29"
rand = "0.9"
# h5ad export, as the R package writes it; HDF5 itself comes in through
# bixverse-sc-data, so no second copy
scx-core = { version = "0.5.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sprs = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 2

# e-means work in progress; drop before release
[patch.crates-io]
ann-search-rs = { git = "https://github.com/GregorLueg/ann-search-rs", branch = "feat-e-means" }
