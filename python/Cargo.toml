[package]
name = "bixverse-py"
version = "0.3.0"
edition = "2024"
authors = ["Gregor Lueg <gregorlueg@me.com>"]
license = "MIT"
description = "Python bindings for bixverse-rs"
publish = false

# Own workspace root, deliberately. The parent workspace is published to
# crates.io and its release job runs `cargo publish`, which must not see a
# path-dependent sibling. This also keeps a root `cargo test` from building pyo3.
[workspace]

[lib]
name = "_bixverse"
crate-type = ["cdylib"]

[dependencies]
# The single cell crates, no extendr, so no libR on the link line. Python
# extras cannot switch Rust features, so the wheel carries every sc feature.
bixverse-sc = { path = "../crates/bixverse-sc", features = ["multi-modal", "bonsai"] }
# `hdf5-static` compiles the bundled HDF5 C library instead of linking a
# system one, so the wheel loads without an HDF5 install. `parquet` hands the
# h5ad / 10x obs and var to DuckDB.
bixverse-sc-data = { path = "../crates/bixverse-sc-data", features = ["hdf5-static", "parquet"] }
crossbeam-channel = "0.5"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pythonize = "0.29"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }

# Accelerate GEMM on macOS, as the R package builds it.
[target.'cfg(target_os = "macos")'.dependencies]
bixverse-core = { path = "../crates/bixverse-core", features = ["accelerate"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev]
opt-level = 2
