site_name: bixverse
site_description: Stream single-cell stores into neural network training, in Rust.
site_url: https://gregorlueg.github.io/bixverse-rs/
repo_url: https://github.com/GregorLueg/bixverse-rs
repo_name: GregorLueg/bixverse-rs
edit_uri: edit/main/python/docs/
copyright: MIT licensed

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - scVI: scvi.md
  - Vignettes:
      - Thinking the bixverse way: vignettes/thinking_single_cell.ipynb
      - Analysing PBMCs: vignettes/pbmc_single_cell.ipynb
      - Data I/O: vignettes/single_cell_io.ipynb
      - kNN searches: vignettes/knn_searches.ipynb
      - Ligand-receptor analysis: vignettes/ligand_receptor.ipynb
      - Plotting: vignettes/single_cell_visualisation.ipynb
      - Subsets and per-group pipelines: vignettes/single_cell_subsets.ipynb
      - Gene sets, regulons and NMF: vignettes/bag_of_genes_single_cells.ipynb
      - Cell trees with Bonsai: vignettes/bonsai.ipynb
      - Pearson residuals and scTransform: vignettes/single_cell_residuals.ipynb
      - Doublet detection: vignettes/doublet_detection.ipynb
      - Multi-modal analysis: vignettes/multi_modal_single_cells.ipynb
      - Clustering and annotation: vignettes/cell_type_annotation.ipynb
      - DIALOGUE: vignettes/dialogue.ipynb
      - Batch correction: vignettes/single_cell_batch_corrections.ipynb
      - Trajectory inference: vignettes/trajectory_inference.ipynb
      - Meta cells: vignettes/meta_cells.ipynb
  - API reference:
      - Top level: api/toplevel.md
      - Loader: api/loader.md
      - Neural networks: api/nn.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  # The `.ipynb` carry their outputs (`dev/vignettes.py execute`); the `.py`
  # sources stay out of the site.
  - mkdocs-jupyter:
      execute: false
      include: ["vignettes/*.ipynb"]
  - mkdocstrings:
      handlers:
        python:
          # `bixverse` sits next to mkdocs.yml, not under `docs/`.
          paths: ["."]
          options:
            docstring_style: google
            # The `Args:` sections carry one row per parameter, which is the
            # whole point of writing them out; a table is how that reads.
            docstring_section_style: table
            # Constructor signature and class docstring render as one block,
            # so a reader sees the defaults next to what they mean.
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            filters: ["!^_"]

# `mkdocs serve` picks up a docstring edit without a restart.
watch:
  - bixverse

exclude_docs: |
  vignettes/*.py
